<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라이브 입찰 POC - 데모 아이템 목록</title>
    <style>
        body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; }
        .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; gap: 16px; align-items: center; }
        .card img { width: 140px; height: 140px; border: 1px solid #eee; }
        a { color: #1a73e8; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
<h2>라이브 입찰 POC — 데모 아이템</h2>
<p>각 아이템의 <b>고정 링크</b>와 <b>QR코드</b>입니다. QR을 폰으로 스캔하거나 링크를 클릭해 입찰 페이지로 진입하세요.</p>
<p>폰에서 QR을 스캔하려면 <code>application.yml</code>의 <code>app.public-base-url</code>을 이 PC의 LAN IP로 설정해야 합니다 (예: <code>http://192.168.0.10:8080</code>).</p>

<div th:each="itemId : ${itemIds}" class="card">
    <img th:src="'/qrcode/' + ${itemId}" alt="QR"/>
    <div>
        <div><b th:text="${itemId}">itemId</b></div>
        <div><a th:href="'/bid/' + ${itemId}" th:text="'/bid/' + ${itemId}">고정 링크</a></div>
        <div><a th:href="'/qrcode/' + ${itemId} + '/link'" target="_blank">QR에 인코딩된 실제 URL 확인</a></div>
    </div>
</div>
</body>
</html>
