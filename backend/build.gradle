plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.artbid'
version = '0.0.1-SNAPSHOT'

java {
	// 컴파일·테스트·bootRun을 모두 Java 21로 실행한다.
	// PC에 설치된 JDK(예: 25)는 Gradle을 띄우는 데만 쓰이고, 21이 없으면
	// settings.gradle의 foojay 리졸버가 자동으로 내려받는다.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 부하테스트/운영 모니터링: /actuator/prometheus로 HTTP, JVM, HikariCP 지표 노출
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// 미디어 업로드(S3)·동영상 트랜스코딩(MediaConvert)·라이브 스트리밍(IVS) 연동
	implementation platform('software.amazon.awssdk:bom:2.28.16')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:mediaconvert'
	// IVS Real-Time Streaming(스테이지·참여 토큰)
	implementation 'software.amazon.awssdk:ivsrealtime'

	// QR코드 생성(경매 고정 링크)
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'

	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Gradle 9부터 테스트 실행에 필요한 JUnit Platform launcher를 자동으로 넣어주지 않는다.
	// 그동안은 spring-kafka-test가 이걸 같이 끌어와서 문제가 안 보였는데, Kafka를 걷어내면서 빠졌다. 버전은 Spring Boot가 맞춰준다.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'

	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

tasks.named('test') {
	useJUnitPlatform()
}
