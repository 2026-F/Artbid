spring:
  application:
    name: artbid-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/artbid
    username: artbid
    password: artbid
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000   # 기본 30초 -> 3초로 단축

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: artbid-backend
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  cors:
    allowed-origins: http://localhost:3000
  aws:
    region: ap-northeast-2

media:
  storage:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: artbid-media
    access-key: artbid
    secret-key: artbid1234
    path-style-access: true
    presign-expiration: 10m
    create-bucket-if-missing: true

  mediaconvert:
    enabled: false