spring:
  application:
    name: artbid-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/artbid
    username: artbid
    password: artbid
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000   # 기본 30초 -> 3초로 단축

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: artbid-backend
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  cors:
    allowed-origins: http://localhost:3000
  aws:
    region: ap-northeast-2
  streaming:
    token:
      publish-duration: 180m
      subscribe-duration: 10m
      subscribe-rate-limit: 20
      subscribe-rate-limit-window: 10m

media:
  storage:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: artbid-media
    access-key: artbid
    secret-key: artbid1234
    path-style-access: true
    presign-expiration: 10m
    create-bucket-if-missing: true

  mediaconvert:
    enabled: false
    # enabled=true로 켤 때 채울 값 (AWS 콘솔에서 확인)
    # endpoint: https://xxxx.mediaconvert.ap-northeast-2.amazonaws.com
    # role-arn: arn:aws:iam::123456789012:role/MediaConvertRole
    # job-template-name: artbid-hls
    # output-key-prefix: transcoded/   # Job Template Destination = s3://{bucket}/transcoded/
    # output-suffix: .m3u8
    # poll-interval-ms: 60000