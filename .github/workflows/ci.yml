name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 브랜치/PR에 커밋을 연달아 푸시했을 때 이전 실행이 자동으로 취소되도록 함.
# 이게 없으면 푸시할 때마다 실행이 쌓여서, 이미 의미 없어진(뒤이은 커밋으로 덮어써진)
# 실행들이 큐를 계속 점유하고 최신 실행은 한참 기다리게 된다.
# pull_request 이벤트에서는 github.ref가 PR마다 바뀌는 merge ref라 head_ref(PR의 소스 브랜치)를
# 우선 쓰고, push 이벤트(head_ref 없음)에서는 ref(브랜치)로 묶는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 테스트 코드가 실제 PostgreSQL·Redis에 연결해서 도는 경우를 대비해
    # GitHub Actions 러너 안에 임시 컨테이너로 띄워줌 (우리 docker-compose랑 같은 이미지)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: artbid
          POSTGRES_USER: artbid
          POSTGRES_PASSWORD: artbid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artbid -d artbid"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: 빌드 + 테스트
        working-directory: backend
        run: ./gradlew build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/artbid
          SPRING_DATA_REDIS_HOST: localhost