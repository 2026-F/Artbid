name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 테스트 코드가 실제 PostgreSQL·Redis에 연결해서 도는 경우를 대비해
    # GitHub Actions 러너 안에 임시 컨테이너로 띄워줌 (우리 docker-compose랑 같은 이미지)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: artbid
          POSTGRES_USER: artbid
          POSTGRES_PASSWORD: artbid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artbid -d artbid"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x backend/gradlew

      - name: 빌드 + 테스트
        working-directory: backend
        run: ./gradlew build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/artbid
          SPRING_DATA_REDIS_HOST: localhost