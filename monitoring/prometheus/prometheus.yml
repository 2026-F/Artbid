global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'backend'
    metrics_path: /actuator/prometheus
    static_configs:
      # 백엔드를 host에서 bootRun으로 띄웠을 때 (compose extra_hosts에 host.docker.internal 설정해둔 이유)
      - targets: ['host.docker.internal:8081']
      # 백엔드를 compose의 backend 서비스로 띄웠으면 이 줄로 바꾸면 됨
      # - targets: ['backend:8081']