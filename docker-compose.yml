services:
  # --- P0 핵심 (기본으로 같이 뜸: docker compose up -d) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artbid
      POSTGRES_USER: artbid
      POSTGRES_PASSWORD: artbid
    ports:
      - "5432:5432"
    volumes:
      - artbid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artbid -d artbid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 확장 단계 (필요할 때만: docker compose --profile expansion up -d) ---
  # 2026-09-06 개정: Kafka는 P0에서 제외하고 확장 단계(Transactional Outbox 도입 시)로 미뤘습니다.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    profiles: ["expansion"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["expansion"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- 미디어 트랙에서 필요할 때: docker compose --profile media up -d ---
  # 2026-09-16 수정: minio/minio가 Docker Hub에서 내려가서(pull access denied) quay.io로 교체.
  minio:
    image: quay.io/minio/minio
    profiles: ["media"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: artbid
      MINIO_ROOT_PASSWORD: artbid1234
    ports:
      - "9000:9000"
      - "9001:9001"

  # --- 부하테스트 모니터링: docker compose --profile monitoring up -d ---
  # Prometheus가 백엔드 관리 포트(8081)의 /actuator/prometheus를 수집하고,
  # k6 결과는 remote write(/api/v1/write)로 받는다. Grafana는 프론트(3000)와 겹치지 않게 3001.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux에서도 호스트의 bootRun 백엔드에 접근

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: artbid1234
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - artbid-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

  backend:
    image: ghcr.io/2026-f/artbid-backend:latest
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artbid
      SPRING_DATA_REDIS_HOST: redis

volumes:
  artbid-postgres-data:
  artbid-grafana-data:
