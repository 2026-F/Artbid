services:
  # --- P0 핵심 (기본으로 같이 뜸: docker compose up -d) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artbid
      POSTGRES_USER: artbid
      POSTGRES_PASSWORD: artbid
    ports:
      - "5432:5432"
    volumes:
      - artbid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artbid -d artbid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 확장 단계 (필요할 때만: docker compose --profile expansion up -d) ---
  # 2026-09-06 개정: Kafka는 P0에서 제외하고 확장 단계(Transactional Outbox 도입 시)로 미뤘습니다.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    profiles: ["expansion"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["expansion"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- 미디어 트랙에서 필요할 때: docker compose --profile media up -d ---
  # 2026-09-16 수정: minio/minio가 Docker Hub에서 내려가서(pull access denied) quay.io로 교체.
  minio:
    image: quay.io/minio/minio
    profiles: ["media"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: artbid
      MINIO_ROOT_PASSWORD: artbid1234
    ports:
      - "9000:9000"
      - "9001:9001"

  # --- 부하테스트 모니터링: docker compose --profile monitoring up -d ---
  # Prometheus가 백엔드 관리 포트(8081)의 /actuator/prometheus를 수집하고,
  # k6 결과는 remote write(/api/v1/write)로 받는다. Grafana는 프론트(3000)와 겹치지 않게 3001.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux에서도 호스트의 bootRun 백엔드에 접근

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: artbid1234
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - artbid-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    profiles: ["monitoring"]
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # cAdvisor가 컨테이너 이름(name 라벨)을 읽으려면 Docker 소켓 접근이 필요함

  backend:
    image: ghcr.io/2026-f/artbid-backend:latest
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artbid
      SPRING_DATA_REDIS_HOST: redis
      # 기본값(10)이 k6 부하테스트에서 바로 꽉 차서 pending이 계속 쌓이는 걸 확인함.
      # Postgres max_connections=100이라 이 정도는 여유 있음. 값은 docker-compose.yml만
      # 고쳐서 바로 테스트 가능 (이미지 재빌드 불필요 — git pull + up -d --force-recreate면 적용됨).
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 30
      # application.yml 기본값이 show-sql: true라서 배포 서버에서도 모든 SQL이 콘솔에 찍히고 있었음.
      # 콘솔 출력(System.out)은 동기화돼 있어서 스레드끼리 줄을 서고, Hibernate는 커넥션을 쥔 채로
      # SQL을 찍기 때문에 커넥션 사용 시간과 CPU를 직접 늘린다(부하테스트에서 평균 19ms 확인).
      # 로컬 bootRun에는 영향 없도록 컨테이너 환경변수로만 끈다.
      SPRING_JPA_SHOW_SQL: "false"


volumes:
  artbid-postgres-data:
  artbid-grafana-data:
